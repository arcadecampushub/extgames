<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinball</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🎯 Pinball</h1>
      <p class="tagline">Launch the ball, hit the bumpers, don't drain.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
      <div class="stat"><span class="stat-label">Balls</span><span class="stat-value" id="balls">3</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="420" height="620"></canvas>
      <p class="message" id="message">Click to launch. Use ← → to nudge the flippers.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="start">Launch</button>
      <button class="btn" id="restart">Restart</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
